<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Vault</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <section id="auth" class="screen"></section>

      <section id="main" class="screen" hidden>
        <aside class="sidebar">
          <header class="side-head">
            <h1 id="tab-title">Чаты</h1>
            <span id="net" class="net" title="Нет соединения"></span>
            <button id="add-btn" class="icon-btn" aria-label="Добавить"></button>
          </header>
          <div class="search">
            <input id="search" type="search" placeholder="Поиск" autocomplete="off" spellcheck="false" />
          </div>
          <div class="panes">
            <div class="track" id="track">
              <div class="pane" data-tab="chats"><ul class="list" id="list-chats"></ul></div>
              <div class="pane" data-tab="groups"><ul class="list" id="list-groups"></ul></div>
              <div class="pane" data-tab="settings" id="settings"></div>
            </div>
          </div>
          <nav class="tabs" id="tabs">
            <span class="tab-indicator" id="tab-indicator"></span>
            <button data-tab="chats" class="active"><i data-icon="chat"></i><span>Чаты</span><b class="badge" hidden></b></button>
            <button data-tab="groups"><i data-icon="group"></i><span>Группы</span><b class="badge" hidden></b></button>
            <button data-tab="settings"><i data-icon="gear"></i><span>Настройки</span></button>
          </nav>
        </aside>

        <main class="chat" id="chat">
          <div class="chat-empty" id="chat-empty">
            <div class="lock-art" data-icon="shield"></div>
            <p>Выберите чат</p>
            <small>Сообщения шифруются на вашем устройстве</small>
          </div>
          <header class="chat-head">
            <button class="icon-btn back" id="back" aria-label="Назад"><i data-icon="back"></i></button>
            <button class="chat-who" id="chat-who">
              <span class="avatar" id="chat-avatar"></span>
              <span class="who-text"><b id="chat-title"></b><small id="chat-sub"></small></span>
            </button>
          </header>
          <div class="messages" id="messages"></div>
          <div class="banner" id="banner" hidden></div>
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4000" autocomplete="off"></textarea>
            <button class="send" id="send" aria-label="Отправить"><i data-icon="send"></i></button>
          </form>
        </main>
      </section>

      <div id="modal-root"></div>
      <div id="toasts"></div>
    </div>
  </body>
</html>
